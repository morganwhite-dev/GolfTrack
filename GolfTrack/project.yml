name: GolfTrack
options:
  bundleIdPrefix: com.golftrack
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GolfTrack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfTrack
    info:
      path: GolfTrack/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "GolfTrack uses your location to find nearby golf courses."
        CFBundleDisplayName: GolfTrack
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.golftrack.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
